name = "tabs-ai-nudge"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 */6 * * *"]

# Secrets should be set via `wrangler secret put`:
